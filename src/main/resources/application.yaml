spring:
  application:
    name: bulksms-mock-gateway
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: "${SMS_EMAIL_FROM}"
    password: "${GMAIL_APP_PASSWORD}"
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  address: "${SANDBOX_BIND_ADDRESS:127.0.0.1}"
  port: "${PORT:8080}"

sandbox:
  token-id: "${BULKSMS_TOKEN_ID}"
  token-secret: "${BULKSMS_TOKEN_SECRET}"
  email-from: "${SMS_EMAIL_FROM}"
  email-to: "${SMS_EMAIL_TO}"
  public-base-url: "${SANDBOX_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:${server.port}}}"
  openapi-spec: "${SANDBOX_OPENAPI_SPEC:classpath:bulksms-api-specification-docs.yaml}"
  webhook-origins: "${SANDBOX_WEBHOOK_ORIGINS:}"
  dispatch-enabled: true
